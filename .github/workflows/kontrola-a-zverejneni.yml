# Po každém uložení do main (v tomto SOUKROMÉM repozitáři):
#   1. plná kontrola ve třech prohlížečích (Chrome/Edge, Firefox, Safari) na telefonu, tabletu i počítači,
#      plus formáty, metadata a tajné údaje,
#   2. JEN když projde: hotový web (index.html, app.js, obsah.js, styl.css, obrazky/) se přenese
#      do VEŘEJNÉHO repozitáře, ze kterého běží GitHub Pages.
# Nic jiného (složka nove-obrazky/, historie, pravidla, testy) se ven nedostane.
name: Kontrola a zveřejnění

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Veřejný repozitář s webem: pocus-jip u stejného vlastníka jako tento repozitář
  # (po převodu na jiný účet se změní sám).
  VEREJNY_REPO: ${{ github.repository_owner }}/pocus-jip

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node test/kontrola.js --prisne

  zverejneni:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: kontrola
    runs-on: ubuntu-latest
    concurrency:
      group: zverejneni
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: zdroj

      - name: Stáhnout veřejný repozitář
        env:
          KLIC: ${{ secrets.VEREJNY_REPO_KLIC }}
        run: |
          if [ -z "$KLIC" ]; then echo "::error::Chybí tajná hodnota VEREJNY_REPO_KLIC"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KLIC" | tr -d '\r' > ~/.ssh/verejny_repo
          chmod 600 ~/.ssh/verejny_repo
          # Otisk veřejné části (není tajný) – musí odpovídat deploy klíči ve veřejném repozitáři
          ssh-keygen -y -f ~/.ssh/verejny_repo | ssh-keygen -lf - || { echo "::error::Klíč VEREJNY_REPO_KLIC není platný soukromý klíč"; exit 1; }
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/verejny_repo -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          # GitHub SSH občas odmítne spojení – zkusit znovu s prodlevou
          for pokus in 1 2 3 4 5; do
            GIT_SSH_COMMAND="ssh -i $HOME/.ssh/verejny_repo -o IdentitiesOnly=yes" git clone --depth 1 "git@github.com:${VEREJNY_REPO}.git" web && break
            [ "$pokus" = 5 ] && exit 1
            rm -rf web; sleep $((pokus * 10))
          done

      - name: Připravit jen soubory webu
        run: |
          cd web && git rm -rq --ignore-unmatch . && cd ..
          mkdir -p web/obrazky
          cp zdroj/index.html zdroj/app.js zdroj/obsah.js zdroj/styl.css web/
          cp -R zdroj/obrazky/. web/obrazky/
          rm -f web/obrazky/README.md
          # README veřejného repozitáře = část README o aplikaci (do první čáry ---)
          awk '/^---$/ {exit} {print}' zdroj/README.md > web/README.md
          printf '\n---\n\n*Tento repozitář obsahuje jen zveřejněnou verzi aplikace a aktualizuje se automaticky.*\n' >> web/README.md
          touch web/.nojekyll

      - name: Zveřejnit
        run: |
          cd web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Web beze změn."; exit 0; fi
          git commit -q -m "$(git -C ../zdroj log -1 --format=%s)"
          for pokus in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Odeslání se nepovedlo (pokus $pokus), zkusím znovu."
            sleep $((pokus * 10))
          done
          exit 1
